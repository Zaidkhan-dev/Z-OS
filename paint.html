<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Z OS Paint</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100" rel="stylesheet" />
  <style>
    :root {
      --glass: blur(8px) saturate(1.2);
    }

    body {
      margin: 0;
      padding: 20px;
      background: url('img.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      gap: 20px;
    }

    .top, .bottom {
      position: relative;
      width: 100%;
      max-width: 960px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3);
      border-radius: 20px;
    }

    .top {
      padding: 10px;
      height: 60vh;
      overflow: hidden;
    }

    .bottom {
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 10px;
      display: block;
      touch-action: none; /* Prevent scroll on touch */
    }

    input[type="color"], input[type="range"], button {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      backdrop-filter: blur(3px);
    }

    input[type="range"] {
      width: 120px;
    }

    button:hover {
      background-color: rgba(255, 255, 255, 0.35);
    }

    label {
      color: white;
      font-size: 14px;
    }
    .closeapps {
  background-color: transparent;
  border: none;
  color: white;
  
  
}
.close {
  position:  absolute;
  top : 10px;
  left : 10px;
  font-size: 40px;
  color: white;
  
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.5),
    inset 0 -1px 0 rgba(255, 255, 255, 0.1),
    inset 0 0 4px 2px rgba(255, 255, 255, 0.2);
  
  
}
  </style>
</head>
<body>
<div class="close">
    <button class="closeapps" onclick="
         document.location='home.html';">
       <i class="material-symbols-outlined">close</i>
       
    </button>
</div>
  <div class="top">
    <canvas id="paintCanvas"></canvas>
  </div>

  <div class="bottom">
    <label for="colorPicker">Color:</label>
    <input type="color" id="colorPicker" value="#ffffff"/>

    <label for="brushSize">Brush Size:</label>
    <input type="range" id="brushSize" min="1" max="20" value="3"/>

    <button onclick="clearCanvas()">🧹 Clear</button>
    <button onclick="saveImage()">💾 Save</button>
  </div>

  <script>
    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");

    const colorPicker = document.getElementById("colorPicker");
    const brushSize = document.getElementById("brushSize");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let drawing = false;
    let color = colorPicker.value;
    let size = brushSize.value;

    colorPicker.addEventListener("input", e => color = e.target.value);
    brushSize.addEventListener("input", e => size = e.target.value);

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseout", stopDraw);
    canvas.addEventListener("mousemove", draw);

    canvas.addEventListener("touchstart", startDraw);
    canvas.addEventListener("touchend", stopDraw);
    canvas.addEventListener("touchcancel", stopDraw);
    canvas.addEventListener("touchmove", drawTouch, { passive: false });

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      ctx.beginPath();
      const x = getX(e);
      const y = getY(e);
      ctx.moveTo(x, y);
      ctx.lineTo(x, y);  // Fix brush downshift by starting line at current point
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    function stopDraw(e) {
      e.preventDefault();
      drawing = false;
      ctx.closePath();
    }

    function draw(e) {
      if (!drawing) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineTo(getX(e), getY(e));
      ctx.stroke();
    }

    function drawTouch(e) {
      e.preventDefault();
      draw(e.touches[0]);
    }

    function getX(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.clientX !== undefined) {
        return e.clientX - rect.left;
      } else if (e.touches && e.touches[0]) {
        return e.touches[0].clientX - rect.left;
      }
      return 0;
    }

    function getY(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.clientY !== undefined) {
        return e.clientY - rect.top;
      } else if (e.touches && e.touches[0]) {
        return e.touches[0].clientY - rect.top;
      }
      return 0;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function saveImage() {
      const image = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = image;
      link.download = "zpaint.png";
      link.click();
    }
  </script>

</body>
</html>
